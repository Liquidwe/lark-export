services:
  lark-export:
    build: .
    image: lark-export
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # These describe the inside of the container, so they override whatever .env says.
      HOST: 0.0.0.0
      PORT: 4310
      DATA_DIR: /app/data
    ports:
      # Localhost unless BIND_ADDRESS says otherwise. Sign-ins and documents pass through this
      # port, so anything beyond one machine belongs behind an HTTPS reverse proxy.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-4310}:4310"
    volumes:
      - lark-export-data:/app/data

volumes:
  lark-export-data:
